<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SnackFit v6 · ZMDI 扇形控制（MVP 靜態版）</title>
  <link href="https://cdn.jsdelivr.net/npm/material-design-iconic-font@2.2.0/dist/css/material-design-iconic-font.min.css" rel="stylesheet">
  <style>
    :root{
      --size:360px;
      --R:150;        /* 扇形外半徑 */
      --r:90;         /* 扇形內半徑 */
      --bg:#0f1115; --panel:#0b0e13; --line:#1a2030; --ring:#222733; --text:#e9eef9; --muted:#9aa3b2;
      --top:#2d7cff; --right:#10c469; --bottom:#ffbb33; --left:#ff5b5b;
      --v:#4da3ff; --e:#13d07a; --m:#ffc24d;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial}
    .wrap{min-height:100%;display:grid;place-items:center;padding:24px}
    .card{width:min(92vw,480px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:14px}
    .title{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 0}
    .title h1{font-size:16px;margin:0}
    .meta{font-size:12px;color:var(--muted)}
    .stage{width:var(--size);height:var(--size);margin:10px auto;position:relative}
    .legend{display:flex;gap:10px;justify-content:center;margin:8px 0 2px;font-size:12px;color:var(--muted)}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;position:relative;top:1px}
    .v .dot{background:var(--v)} .e .dot{background:var(--e)} .m .dot{background:var(--m)}
    .sector-icon{font-size:28px;line-height:1;color:#fff;display:grid;place-items:center;width:48px;height:48px}
    .hit{fill:transparent}
    .lbl{font-size:12px;fill:#cfd6e6;opacity:.9}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">
        <h1>SnackFit · v6（ZMDI）</h1>
        <div class="meta">靜態 · 扇形=按鈕+Icon 同要素 · 預設進度</div>
      </div>

      <div class="stage" aria-label="Snack Ring 控制環">
        <svg width="100%" height="100%" viewBox="0 0 360 360" role="img" aria-label="操作圓環">
          <!-- 背景環 -->
          <circle cx="180" cy="180" r="150" fill="none" stroke="var(--ring)" stroke-width="24"/>

          <!-- 進度：非 0 預設 -->
          <circle cx="180" cy="180" r="150" fill="none" stroke="var(--v)" stroke-width="6" stroke-linecap="round"
                  transform="rotate(-90 180 180)" stroke-dasharray="942.4778 942.4778" stroke-dashoffset="358"/>
          <circle cx="180" cy="180" r="140" fill="none" stroke="var(--e)" stroke-width="6" stroke-linecap="round"
                  transform="rotate(-90 180 180)" stroke-dasharray="879.6459 879.6459" stroke-dashoffset="483"/>
          <circle cx="180" cy="180" r="130" fill="none" stroke="var(--m)" stroke-width="6" stroke-linecap="round"
                  transform="rotate(-90 180 180)" stroke-dasharray="816.8141 816.8141" stroke-dashoffset="179"/>

          <!-- 上（換一個） -->
          <a xlink:href="#" class="sector sector-top" aria-label="換一個">
            <g>
              <path fill="var(--top)" opacity=".18"
                    d="M180,30 A150,150 0 0 1 330,180 L270,180 A90,90 0 0 0 180,90 Z"/>
              <circle class="hit" cx="225" cy="105" r="60"/>
              <foreignObject x="156" y="68" width="48" height="48">
                <div xmlns="http://www.w3.org/1999/xhtml" class="sector-icon"><i class="zmdi zmdi-refresh-alt" aria-hidden="true"></i></div>
              </foreignObject>
            </g>
          </a>

          <!-- 右（增加強度） -->
          <a xlink:href="#" class="sector sector-right" aria-label="增加強度">
            <g>
              <path fill="var(--right)" opacity=".18"
                    d="M330,180 A150,150 0 0 1 180,330 L180,270 A90,90 0 0 0 270,180 Z"/>
              <circle class="hit" cx="255" cy="180" r="60"/>
              <foreignObject x="228" y="156" width="48" height="48">
                <div xmlns="http://www.w3.org/1999/xhtml" class="sector-icon"><i class="zmdi zmdi-plus" aria-hidden="true"></i></div>
              </foreignObject>
            </g>
          </a>

          <!-- 下（完成） -->
          <a xlink:href="#" class="sector sector-bottom" aria-label="完成本動作">
            <g>
              <path fill="var(--bottom)" opacity=".18"
                    d="M180,330 A150,150 0 0 1 30,180 L90,180 A90,90 0 0 0 180,270 Z"/>
              <circle class="hit" cx="180" cy="255" r="60"/>
              <foreignObject x="156" y="228" width="48" height="48">
                <div xmlns="http://www.w3.org/1999/xhtml" class="sector-icon"><i class="zmdi zmdi-check" aria-hidden="true"></i></div>
              </foreignObject>
            </g>
          </a>

          <!-- 左（降低強度） -->
          <a xlink:href="#" class="sector sector-left" aria-label="降低強度">
            <g>
              <path fill="var(--left)" opacity=".18"
                    d="M30,180 A150,150 0 0 1 180,30 L180,90 A90,90 0 0 0 90,180 Z"/>
              <circle class="hit" cx="105" cy="180" r="60"/>
              <foreignObject x="84" y="156" width="48" height="48">
                <div xmlns="http://www.w3.org/1999/xhtml" class="sector-icon"><i class="zmdi zmdi-minus" aria-hidden="true"></i></div>
              </foreignObject>
            </g>
          </a>

          <!-- 中央（零縫貼合） -->
          <g aria-label="播放">
            <circle cx="180" cy="180" r="90.2" fill="#e9eef9"/>
            <foreignObject x="135" y="135" width="90" height="90">
              <div xmlns="http://www.w3.org/1999/xhtml" style="width:90px;height:90px;display:grid;place-items:center;color:#0b0e13;font-size:36px;border-radius:50%">
                <i class="zmdi zmdi-play" aria-hidden="true"></i>
              </div>
            </foreignObject>
          </g>
        </svg>
      </div>

      <div class="legend">
        <span class="v"><span class="dot"></span>V 62%</span>
        <span class="e"><span class="dot"></span>E 45%</span>
        <span class="m"><span class="dot"></span>M 78%</span>
      </div>
    </div>
  </div>
</body>
</html>
