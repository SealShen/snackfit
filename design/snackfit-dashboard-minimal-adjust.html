<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnackFit Dashboard · Minimal Adjustments</title>
  <style>
    :root{
      --bg:#0E0E10;
      --surface:#16161A;
      --card:#1F1F24;
      --hair:#2A2B31;
      --text:#EAEAF0;
      --muted:#A0A1B2;
      --primary:#A88CF5; /* weekly */
      --accent:#23C074;  /* today */
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font:16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial;
      padding:24px; display:flex; flex-direction:column; align-items:center; gap:24px;
    }
    .wrap{width:100%; max-width:420px}

    /* Environment chips */
    .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px}
    .chip{
      padding:8px 14px; border-radius:999px; background:#202028; border:1px solid #2C2C33;
      color:#CFCFD8; font-weight:800; font-size:12px; letter-spacing:.2px; opacity:.95; cursor:pointer;
    }
    .chip.active{border-color:var(--primary); color:var(--primary); background:#1B1823; box-shadow:0 0 0 2px rgba(168,140,245,.2) inset}

    /* Main circular control */
    .stage{
      position:relative; display:flex; align-items:center; justify-content:center; padding:24px 0 8px;
    }
    /* Rings sit BEHIND everything */
    .rings{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:0; pointer-events:none;
    }
    .ring-outer{position:absolute; width:380px; height:380px; transform:rotate(-90deg)}
    .ring-inner{position:absolute; width:320px; height:320px; transform:rotate(-90deg)}

    /* Controls stay on top */
    .controls{
      position:relative; z-index:1; display:flex; align-items:center; gap:24px;
    }
    .btn{
      width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
      background:var(--card); border:1px solid var(--hair); color:var(--text);
      box-shadow:0 10px 24px rgba(0,0,0,.4);
      transition:transform .15s ease, background .2s ease, border-color .2s ease, color .2s ease;
      cursor:pointer; user-select:none;
    }
    .btn:hover{transform:translateY(-2px); background:#24242B; border-color:#3A3B45}
    .btn:active{transform:translateY(0) scale(.98)}
    .btn[disabled]{opacity:.35; cursor:not-allowed}

    .btn-play{
      width:96px; height:96px; border-radius:50%;
      border:3px solid var(--accent); color:var(--accent);
      background:linear-gradient(135deg, #1c1d22, #121318);
      box-shadow:0 16px 40px rgba(35,192,116,.28), inset 0 0 0 1px rgba(255,255,255,.04);
      font-size:36px; font-weight:900; display:grid; place-items:center;
    }

    /* +/- helper labels */
    .hint{
      position:absolute; left:50%; transform:translateX(-50%);
      color:#cfd1dc; font-size:11px; letter-spacing:.3px; font-weight:700; opacity:.9;
      text-shadow:0 1px 0 rgba(0,0,0,.25);
      white-space:nowrap;
    }
    .hint-lighter{bottom:-18px;}   /* under minus */
    .hint-heavier{top:-18px;}      /* above plus */

    /* Exercise title */
    .title{margin:18px 0 12px; text-align:center; font-size:28px; font-weight:900}

    /* Shuffle button */
    .swap{display:flex; justify-content:center; margin:0 0 22px}
    .swap button{
      padding:10px 16px; border-radius:999px; background:#201f29;
      border:1px solid var(--primary); color:var(--primary); font-weight:800; cursor:pointer;
      box-shadow:0 10px 24px rgba(168,140,245,.18);
    }
    .swap button:hover{background:#242235}

    /* Stats block */
    .stats{
      background:linear-gradient(135deg, rgba(36,36,44,.75), rgba(18,18,24,.75));
      border:1px solid #2b2c33; border-radius:22px; padding:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.45);
    }
    .row{display:flex; align-items:baseline; justify-content:space-between; padding:6px 0}
    .row + .row{border-top:1px solid rgba(255,255,255,.06); margin-top:6px}
    .tag{font-weight:800; font-size:13px}
    .tag.today{color:var(--accent)}
    .tag.week{color:var(--primary)}
    .val{display:flex; align-items:baseline; gap:8px}
    .val strong{font-size:24px; font-weight:900}
    .muted{color:#8f92a2; font-size:12px}
    .pct{font-weight:900}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Environment Chips -->
    <div class="chips" id="chips"></div>

    <!-- Main circular control -->
    <div class="stage">
      <!-- Rings (background layer) -->
      <div class="rings" aria-hidden="true">
        <!-- Weekly ring (outer, purple) -->
        <svg class="ring-outer" viewBox="0 0 384 384">
          <circle cx="192" cy="192" r="170" fill="none" stroke="rgba(168, 140, 245, 0.15)" stroke-width="20"/>
          <circle id="weekArc" cx="192" cy="192" r="170" fill="none" stroke="#A88CF5" stroke-width="20"
                  stroke-linecap="round" stroke-dasharray="1069" stroke-dashoffset="1069"/>
        </svg>
        <!-- Daily ring (inner, green) -->
        <svg class="ring-inner" viewBox="0 0 320 320">
          <circle cx="160" cy="160" r="142" fill="none" stroke="rgba(35, 192, 116, 0.15)" stroke-width="20"/>
          <circle id="dayArc" cx="160" cy="160" r="142" fill="none" stroke="#23C074" stroke-width="20"
                  stroke-linecap="round" stroke-dasharray="892" stroke-dashoffset="892"/>
        </svg>
      </div>

      <!-- Controls (foreground) -->
      <div class="controls">
        <!-- Minus with 'lighter' below -->
        <div style="position:relative; display:grid; place-items:center;">
          <button class="btn" id="btnMinus" title="lighter">−</button>
          <div class="hint hint-lighter">lighter</div>
        </div>

        <button class="btn btn-play" id="btnPlay" title="開始">▶</button>

        <!-- Plus with 'heavier' above -->
        <div style="position:relative; display:grid; place-items:center;">
          <div class="hint hint-heavier">heavier</div>
          <button class="btn" id="btnPlus" title="heavier">＋</button>
        </div>
      </div>
    </div>

    <!-- Exercise (no intensity info per request) -->
    <div class="title" id="exercise">靠牆深蹲</div>

    <!-- Shuffle -->
    <div class="swap">
      <button id="btnShuffle" title="換一個">🔄 換一個</button>
    </div>

    <!-- Progress Stats -->
    <div class="stats" id="stats">
      <div class="row">
        <span class="tag today">今日進度</span>
        <div class="val">
          <strong id="todayVal">12</strong><span class="muted">/ <span id="todayGoal">20</span> 分鐘</span>
        </div>
        <span class="pct" id="todayPct" style="color:var(--accent)">60%</span>
      </div>
      <div class="row">
        <span class="tag week">本週進度</span>
        <div class="val">
          <strong id="weekVal">90</strong><span class="muted">/ <span id="weekGoal">150</span> 分鐘</span>
        </div>
        <span class="pct" id="weekPct" style="color:var(--primary)">60%</span>
      </div>
    </div>
  </div>

<script>
  // Demo data / minimal behavior
  const ENV = [
    { id:'home',   label:'家裡'    },
    { id:'office', label:'辦公室'  },
    { id:'gym',    label:'健身房'  },
    { id:'station',label:'車站'    },
  ];
  const EXS = ['靠牆深蹲','伏地挺身','弓箭步','平板支撐','開合跳'];

  let state = {
    env:'home',
    exIndex:0,
    today:12, todayGoal:20,
    week:90, weekGoal:150,
  };

  // Build chips
  const chipsWrap = document.getElementById('chips');
  function renderChips(){
    chipsWrap.innerHTML = '';
    ENV.forEach(env=>{
      const b = document.createElement('button');
      b.className = 'chip' + (state.env===env.id?' active':'');
      b.textContent = env.label;
      b.onclick = () => { state.env = env.id; renderChips(); };
      chipsWrap.appendChild(b);
    });
  }
  renderChips();

  // Exercise name
  const titleEl = document.getElementById('exercise');
  function shuffleExercise(){
    state.exIndex = (state.exIndex + 1) % EXS.length;
    titleEl.textContent = EXS[state.exIndex];
  }
  document.getElementById('btnShuffle').onclick = shuffleExercise;

  // Progress & rings
  function renderProgress(){
    const todayPct = Math.max(0, Math.min(1, state.today/state.todayGoal));
    const weekPct  = Math.max(0, Math.min(1, state.week/state.weekGoal));

    // Numbers
    document.getElementById('todayVal').textContent = state.today;
    document.getElementById('todayGoal').textContent = state.todayGoal;
    document.getElementById('weekVal').textContent = state.week;
    document.getElementById('weekGoal').textContent = state.weekGoal;
    document.getElementById('todayPct').textContent = Math.round(todayPct*100) + '%';
    document.getElementById('weekPct').textContent = Math.round(weekPct*100) + '%';

    // Rings
    const dayCirc   = 2 * Math.PI * 142;
    const weekCirc  = 2 * Math.PI * 170;
    const dayOff    = dayCirc  * (1 - todayPct);
    const weekOff   = weekCirc * (1 - weekPct);
    requestAnimationFrame(()=>{
      document.getElementById('dayArc').setAttribute('stroke-dashoffset', dayOff);
      document.getElementById('weekArc').setAttribute('stroke-dashoffset', weekOff);
    });
  }
  renderProgress();

  // +/- now only provide subtle feedback (intensity hidden by request)
  document.getElementById('btnMinus').onclick = () => {};
  document.getElementById('btnPlus').onclick = () => {};
  document.getElementById('btnPlay').onclick = () => {};
</script>
</body>
</html>
